<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RATIO | Built Different</title>
<meta name="description" content="RATIO — Built Different. اطلب عبر واتساب. Heavyweight hoodies, order via WhatsApp.">
<meta name="theme-color" content="#171615">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@1,800&family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#171615;--ink:#e6e3dc;--mute:#948f86;--dust:#8a7565;--line:#34322f;--card:#1f1e1c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:var(--bg)}
body{color:var(--ink);font:300 16px/1.7 "Readex Pro",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
h2{font-family:"Anybody","Readex Pro",sans-serif;font-style:italic;font-weight:800;line-height:1.1;font-size:clamp(34px,6vw,60px);margin-bottom:10px}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:fixed;inset:0 0 auto;z-index:20;padding-top:env(safe-area-inset-top);background:linear-gradient(rgba(23,22,21,.85),transparent)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.bar img{height:22px;display:block}
nav{display:flex;gap:22px;margin-inline-start:auto}nav a{text-decoration:none;font-size:14px;color:var(--mute)}nav a:hover{color:var(--ink)}
.btn{border:1px solid var(--ink);background:transparent;padding:9px 20px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:600;font-size:14px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn:hover{background:var(--dust);border-color:var(--dust);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
#cnt{margin-inline-start:6px}
@media(max-width:760px){nav{display:none}.bar{justify-content:space-between}}
.banner{display:block;width:100%;height:auto;min-height:220px;object-fit:cover}
.cta{padding:28px 0 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.cta p{color:var(--mute);flex:1 1 260px;max-width:48ch}
.row{display:flex;gap:12px;flex-wrap:wrap}
section{padding:70px 0}
.sub{color:var(--mute);margin-bottom:26px}
.tools{display:flex;gap:10px;margin-bottom:20px}
.tools input,.f input,.f select,.f textarea{background:var(--card);border:1px solid var(--line);padding:10px 14px;width:100%}
.tools input{flex:1}.tools select{background:var(--card);border:1px solid var(--line);padding:10px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.p{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.p .pic{aspect-ratio:4/5;background:#262422 center/cover no-repeat;display:grid;place-items:center}
.p .pic img{width:60%;opacity:.25}
.p .in{padding:16px;display:grid;gap:12px;flex:1;align-content:start}
.p h3{font:600 18px "Readex Pro";display:flex;justify-content:space-between;gap:10px}.pr{color:var(--dust);font-weight:600;white-space:nowrap}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.ch{min-width:40px;height:34px;padding:0 12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.ch[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{grid-column:1/-1;color:var(--mute);padding:30px 0}
.story{background:linear-gradient(rgba(23,22,21,.82),rgba(23,22,21,.92)),var(--hero) center/cover}
.story p{max-width:56ch;margin-bottom:14px;color:#cfcac0}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:36px}
.why div{border-top:1px solid var(--ink);padding-top:12px;font-weight:600}.why small{display:block;font-weight:300;color:var(--mute)}
footer{padding:30px 0 44px;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none}#shade.on{display:block}
#drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,100%);background:var(--card);z-index:40;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;border-inline-start:1px solid var(--line);transform:translateX(105%);transition:transform .3s}
html[dir=rtl] #drawer{transform:translateX(-105%)}#drawer.open{transform:none!important}
#items{flex:1;overflow:auto;margin:14px 0}
.ci{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.ci .t{flex:1;font-size:15px}.ci small{display:block;color:var(--mute)}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border:1px solid var(--mute);background:transparent;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:18px;margin-bottom:12px}
dialog{border:1px solid var(--ink);background:var(--card);color:var(--ink);padding:24px;width:min(560px,calc(100% - 24px));max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font-size:30px}
.f{display:grid;gap:12px;margin-top:14px}.f label{display:grid;gap:4px;font-size:14px;font-weight:600}.f .h{font-weight:300;color:var(--mute);font-size:13px}
.err{color:#ff8a7a;font-size:13px;min-height:1em}
.ap{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}.ap img{width:44px;height:44px;object-fit:cover;background:#262422}.ap span{flex:1}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 20px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
#adm{width:min(760px,calc(100% - 24px))}
.tabs{display:flex;gap:8px;margin:12px 0}
.oc{border:1px solid var(--line);padding:12px;margin-bottom:10px;font-size:14px;display:grid;gap:6px}
.oc select{background:var(--bg);border:1px solid var(--line);padding:6px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.st div{border:1px solid var(--line);padding:10px;font-size:13px}.st b{display:block;font-size:19px}
@media(max-width:520px){.bar{gap:6px}.btn{padding:8px 12px}}
</style>
</head>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* طبقة البيانات: هنبدلها بقاعدة بيانات (Supabase) مع الداشبورد */
const sb=(CONFIG.supabaseUrl&&window.supabase)?supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey):null;
let me={user:null,role:"customer"};
const fromRow=r=>({id:r.id,ar:r.ar,en:r.en||r.ar,price:Number(r.price),sizes:r.sizes||[],colors:r.colors||[],img:r.img||""});
const DB={
 async load(){if(!sb)return store.get("prods",null)||DEFAULTS;const{data,error}=await sb.from("products").select("*").order("created_at");if(error){console.warn(error);return DEFAULTS}return data.map(fromRow)},
 async save(p){
  if(!sb){const l=store.get("prods",null)||DEFAULTS.slice();if(p.id){l[l.findIndex(x=>x.id===p.id)]={...p}}else l.push({...p,id:Date.now()});store.set("prods",l);return}
  let img=p.img;
  if(img&&img.startsWith("data:")){const blob=await(await fetch(img)).blob(),path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
   const{error}=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"});if(error)throw error;img=sb.storage.from("products").getPublicUrl(path).data.publicUrl}
  const row={ar:p.ar,en:p.en,price:p.price,sizes:p.sizes,colors:p.colors,img};
  const{error}=await(p.id?sb.from("products").update(row).eq("id",p.id):sb.from("products").insert(row));if(error)throw error},
 async del(id){if(!sb){store.set("prods",(store.get("prods",null)||DEFAULTS).filter(x=>x.id!==id));return}const{error}=await sb.from("products").delete().eq("id",id);if(error)throw error},
 async orders(){if(!sb)return store.get("orders",[]).slice().reverse();const{data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false}).limit(500);if(error)throw error;return data},
 async setStatus(id,s){if(!sb){store.set("orders",store.get("orders",[]).map(o=>o.id===id?{...o,status:s}:o));return}const{error}=await sb.from("orders").update({status:s}).eq("id",id);if(error)throw error},
 async saveOrder(o){
  const items=o.items.map(i=>{const p=P(i.id);return{name:p.ar,color:i.c,size:i.s,qty:i.q,price:p.price}}),b={name:o.name,phone:o.phone,gov:o.gov,address:o.address,notes:o.notes,items,total:o.total};
  if(!sb){const a=store.get("orders",[]);a.push({...b,id:Date.now(),created_at:new Date().toISOString(),status:"new"});store.set("orders",a);return}
  const{error}=await sb.from("orders").insert({...b,user_id:me.user?me.user.id:null});if(error)throw error}
};
let lang=store.get("lang","ar"),cart=store.get("cart",[]),pick={},list=DEFAULTS;
const t=k=>T[lang][k],money=n=>Number(n).toLocaleString(lang==="ar"?"ar-EG":"en-US")+" "+CONFIG.currency[lang];
const P=id=>list.find(p=>p.id===id);

function renderGrid(){
  const q=$("#q").value.trim().toLowerCase(),o=$("#sort").value;
  let a=list.filter(p=>(p.ar+p.en).toLowerCase().includes(q));
  if(o==="1")a.sort((x,y)=>x.price-y.price);if(o==="2")a.sort((x,y)=>y.price-x.price);
  $("#grid").innerHTML=a.length?a.map(p=>{
    const s=pick[p.id]||(pick[p.id]={c:p.colors[0]||"",s:p.sizes[1]||p.sizes[0]||""});
    return `<article class="p" data-id="${p.id}"><div class="pic" ${p.img?`style="background-image:url(${p.img})"`:""}>${p.img?"":`<img src="${LOGO}" alt="">`}</div>
    <div class="in"><h3><span>${esc(p[lang]||p.ar)}</span><span class="pr">${money(p.price)}</span></h3>
    ${p.colors.length?`<div class="opts" role="group">${p.colors.map(c=>`<button class="ch" data-c="${esc(c)}" aria-pressed="${c===s.c}">${esc(c)}</button>`).join("")}</div>`:""}
    ${p.sizes.length?`<div class="opts" role="group">${p.sizes.map(z=>`<button class="ch" data-s="${esc(z)}" aria-pressed="${z===s.s}">${esc(z)}</button>`).join("")}</div>`:""}
    <button class="btn fill add" style="margin-top:auto">${t("add")}</button></div></article>`}).join(""):`<p class="empty">${t("none")}</p>`;
}
$("#grid").addEventListener("click",e=>{
  const card=e.target.closest(".p");if(!card)return;const id=+card.dataset.id,s=pick[id],b=e.target.closest(".ch");
  if(b&&b.dataset.c!==undefined){s.c=b.dataset.c;renderGrid()}
  else if(b){s.s=b.dataset.s;renderGrid()}
  else if(e.target.closest(".add")){const h=cart.find(i=>i.id===id&&i.c===s.c&&i.s===s.s);h?h.q=Math.min(10,h.q+1):cart.push({id,c:s.c,s:s.s,q:1});saveCart();toast(t("added"))}
});
$("#q").oninput=$("#sort").onchange=renderGrid;

const total=()=>cart.reduce((a,i)=>a+P(i.id).price*i.q,0);
function saveCart(){store.set("cart",cart);renderCart()}
function renderCart(){
  $("#cnt").textContent=cart.reduce((a,i)=>a+i.q,0);
  $("#items").innerHTML=cart.length?cart.map((i,k)=>{const p=P(i.id);return `<div class="ci"><div class="t">${esc(p[lang]||p.ar)}<small>${esc(i.c)} · ${esc(i.s)} · ${money(p.price)}</small></div><div class="q"><button data-k="${k}" data-d="-1" aria-label="-">−</button><b>${i.q}</b><button data-k="${k}" data-d="1" aria-label="+">+</button></div></div>`}).join(""):`<p class="sub">${t("empty")}</p>`;
  $("#total").textContent=money(total());$("#checkout").disabled=!cart.length;
}
$("#items").onclick=e=>{const b=e.target.closest("button[data-k]");if(!b)return;const i=cart[+b.dataset.k];i.q=Math.min(10,i.q+ +b.dataset.d);if(i.q<1)cart.splice(+b.dataset.k,1);saveCart()};
const openCart=o=>{$("#drawer").classList.toggle("open",o);$("#shade").classList.toggle("on",o)};
$("#cartBtn").onclick=()=>openCart(true);$("#closeCart").onclick=$("#shade").onclick=()=>openCart(false);
$("#checkout").onclick=()=>{openCart(false);$("#dlg").showModal()};$("#cancel").onclick=()=>$("#dlg").close();
addEventListener("keydown",e=>{if(e.key==="Escape")openCart(false)});
$("#fp").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"");

$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  const n=$("#fn").value.trim(),p=$("#fp").value.trim(),g=$("#fg").value,a=$("#fa").value.trim(),no=$("#fno").value.trim();
  $("#ep").textContent=$("#ef").textContent="";
  if(!/^01\d{9}$/.test(p)){$("#ep").textContent=t("badPhone");return}
  if(!n||!g||!a||!cart.length){$("#ef").textContent=t("badAll");return}
  if($("#rem").checked)store.set("me",{n,p,g,a});
  const m=t("msg"),lines=cart.map(i=>{const pr=P(i.id);return `• ${pr[lang]||pr.ar} — ${i.c} / ${i.s} × ${i.q} = ${money(pr.price*i.q)}`});
  try{await DB.saveOrder({date:new Date().toISOString(),name:n,phone:p,gov:g,address:a,notes:no,items:cart,total:total(),status:"new"})}catch(err){console.error("Supabase order save failed:",err);$("#ef").textContent="حصلت مشكلة أثناء حفظ الطلب. حاول مرة تانية.";return}
  const text=[m.hi,...lines,"",`${m.t}: ${money(total())}`,`${m.n}: ${n}`,`${m.p}: ${p}`,`${m.g}: ${g}`,`${m.a}: ${a}`,no&&`${m.no}: ${no}`].filter(x=>x!==""&&x!==undefined).join("\n");
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(text)}`,"_blank");
  cart=[];saveCart();$("#dlg").close();
});

/* ===== الحساب والصلاحيات ===== */
async function refreshMe(){
  me={user:null,role:"customer"};
  if(sb){const{data:{session}}=await sb.auth.getSession();me.user=session?session.user:null;
    if(me.user){const{data}=await sb.from("profiles").select("role").eq("id",me.user.id).maybeSingle();if(data)me.role=data.role}}
  else if(location.hash==="#admin")me.role="admin";
  $("#acct").hidden=!sb;$("#acct").textContent=me.user?"خروج":"دخول";$("#admBtn").hidden=me.role!=="admin";
}
let regMode=false;
function setMode(r){regMode=r;$("#aT").textContent=r?"حساب جديد":"تسجيل الدخول";$("#aGo").textContent=r?"إنشاء حساب":"دخول";$("#aSw").textContent=r?"عندي حساب":"مش عندي حساب"}
function openAuth(){$("#ae").textContent="";setMode(false);$("#auth").showModal()}
$("#acct").onclick=async()=>{if(me.user){await sb.auth.signOut();await refreshMe();toast("اتسجل الخروج")}else openAuth()};
$("#aSw").onclick=()=>setMode(!regMode);$("#aX").onclick=()=>$("#auth").close();
$("#authF").onsubmit=async e=>{
  e.preventDefault();$("#ae").textContent="";
  const c={email:$("#ae1").value.trim(),password:$("#ae2").value};
  const{error,data}=regMode?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
  if(error){$("#ae").textContent=error.message;return}
  if(regMode&&!data.session){$("#ae").textContent="اتبعتلك إيميل تأكيد — اضغط على اللينك وبعدين سجّل دخول.";return}
  $("#auth").close();await refreshMe();toast("أهلًا بيك");
};

/* ===== لوحة الإدارة (للأدمن بس) ===== */
let editImg="",orders=[];
const ST={new:"جديد",confirmed:"اتأكد",shipped:"اتشحن",delivered:"اتسلّم",cancelled:"ملغي"};
function openAdmin(){if(me.role!=="admin")return;$("#adm").showModal();tab("p");renderAdmin()}
function tab(x){$("#tp").hidden=x!=="p";$("#to").hidden=x!=="o";if(x==="o")loadOrders()}
$("#admBtn").onclick=openAdmin;$("#admX").onclick=()=>$("#adm").close();$("#tbP").onclick=()=>tab("p");$("#tbO").onclick=()=>tab("o");
function renderAdmin(){$("#aList").innerHTML=list.map(p=>`<div class="ap"><img ${p.img?`src="${p.img}"`:""} alt=""><span>${esc(p.ar)} — ${money(p.price)}</span><button class="btn" data-ed="${p.id}">تعديل</button><button class="btn" data-del="${p.id}">حذف</button></div>`).join("")||"<p class='sub'>مفيش منتجات.</p>"}
async function reload(){list=await DB.load();cart=cart.filter(i=>P(i.id));saveCart();renderAdmin();renderGrid()}
function resetF(){$("#addF").reset();$("#a0").value="";editImg="";$("#a4").value="M, L, XL";$("#a5").value="Black, Bone";$("#aGoP").textContent="إضافة المنتج";$("#aCan").hidden=true}
$("#aCan").onclick=resetF;
$("#aList").onclick=async e=>{
  const d=e.target.closest("[data-del]"),ed=e.target.closest("[data-ed]");
  if(d&&confirm("حذف المنتج؟")){try{await DB.del(+d.dataset.del);await reload()}catch(err){toast(err.message)}}
  if(ed){const p=P(+ed.dataset.ed);$("#a0").value=p.id;$("#a1").value=p.ar;$("#a2").value=p.en;$("#a3").value=p.price;$("#a4").value=p.sizes.join(", ");$("#a5").value=p.colors.join(", ");editImg=p.img;$("#a6").value="";$("#aGoP").textContent="حفظ التعديل";$("#aCan").hidden=false;$("#addF").scrollIntoView()}
};
const toImg=f=>new Promise(r=>{if(!f)return r("");const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.82))};im.onerror=()=>r("");im.src=u});
const csv=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
$("#addF").onsubmit=async e=>{
  e.preventDefault();const f=$("#a6").files[0];
  const p={id:+$("#a0").value||null,ar:$("#a1").value.trim(),en:$("#a2").value.trim(),price:+$("#a3").value,sizes:csv($("#a4").value),colors:csv($("#a5").value),img:f?await toImg(f):editImg};
  try{await DB.save(p);resetF();await reload();toast("اتحفظ ✓")}catch(err){toast("خطأ: "+(err.message||err))}
};
async function loadOrders(){
  $("#oList").textContent="…";
  try{orders=await DB.orders()}catch(err){$("#oList").textContent=err.message;return}
  const now=new Date(),dt=o=>new Date(o.created_at),live=orders.filter(o=>o.status!=="cancelled"),sum=a=>a.reduce((x,o)=>x+Number(o.total||0),0);
  const today=live.filter(o=>dt(o).toDateString()===now.toDateString()),month=live.filter(o=>dt(o).getMonth()===now.getMonth()&&dt(o).getFullYear()===now.getFullYear());
  $("#stats").innerHTML=`<div>مبيعات اليوم<b>${money(sum(today))}</b></div><div>مبيعات الشهر<b>${money(sum(month))}</b></div><div>طلبات جديدة<b>${orders.filter(o=>o.status==="new").length}</b></div>`;
  $("#oList").innerHTML=orders.map(o=>`<div class="oc"><b>#${o.id} — ${esc(o.name)} — ${money(o.total)}</b><span>${dt(o).toLocaleString("ar-EG")}</span><span>${esc(o.gov)} — ${esc(o.address)}</span><a href="https://wa.me/20${esc(String(o.phone).slice(1))}" target="_blank" rel="noopener">${esc(o.phone)}</a><span>${(o.items||[]).map(i=>`${esc(i.name)} (${esc(i.color)}/${esc(i.size)}) ×${i.qty}`).join("، ")}</span>${o.notes?`<span>ملاحظات: ${esc(o.notes)}</span>`:""}<select data-st="${o.id}" aria-label="status">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===o.status?"selected":""}>${v}</option>`).join("")}</select></div>`).join("")||"<p class='sub'>مفيش طلبات.</p>";
}
$("#oList").onchange=async e=>{const s=e.target.closest("[data-st]");if(!s)return;try{await DB.setStatus(+s.dataset.st,s.value);loadOrders()}catch(err){toast(err.message)}};
function route(){if(location.hash!=="#admin")return;if(!sb){refreshMe().then(openAdmin)}else if(me.role==="admin")openAdmin();else if(!me.user)openAuth()}
addEventListener("hashchange",route);

let tt;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1500)}
function applyLang(){
  const d=lang==="ar";document.documentElement.lang=lang;document.documentElement.dir=d?"rtl":"ltr";$("#lang").textContent=d?"EN":"AR";
  $$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  $("#storyTxt").innerHTML=t("story").map(p=>`<p>${esc(p)}</p>`).join("");
  $("#why").innerHTML=t("why").map(w=>`<div>${esc(w[0])}<small>${esc(w[1])}</small></div>`).join("");
  $("#fg").innerHTML=`<option value="">${t("govPick")}</option>`+GOVS.map(x=>`<option value="${x[d?0:1]}">${x[d?0:1]}</option>`).join("");
  $("#soc").innerHTML=`<a class="btn fill" href="https://wa.me/${CONFIG.whatsapp}">${t("wa")}</a>`+CONFIG.social.map(s=>`<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join("");
  $("#foot").textContent=`© ${new Date().getFullYear()} ${CONFIG.brand} — ${t("foot")}`;
  const me=store.get("me",null);if(me){$("#fn").value=me.n||"";$("#fp").value=me.p||"";$("#fg").value=me.g||"";$("#fa").value=me.a||""}
  renderGrid();renderCart();
}
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";store.set("lang",lang);applyLang()};
(async()=>{
  list=await DB.load();cart=cart.filter(i=>P(i.id));applyLang();await refreshMe();route();
  if(sb)sb.auth.onAuthStateChange(()=>setTimeout(refreshMe,0));
})();
</script>
